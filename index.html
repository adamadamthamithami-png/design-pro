<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Pro - ديزاين برو</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; direction: rtl; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: grid; grid-template-columns: 250px 1fr 350px; min-height: 90vh; }
        .sidebar-left { background: #f8f9fa; padding: 20px; border-left: 1px solid #ddd; overflow-y: auto; }
        .sidebar-left h3 { color: #333; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
        .templates { display: flex; flex-direction: column; gap: 10px; }
        .template-btn { padding: 12px 15px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; transition: all 0.3s; }
        .template-btn:hover { border-color: #667eea; background: #f0f4ff; color: #667eea; }
        .template-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .canvas-area { background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .toolbar { width: 100%; background: #f8f9fa; padding: 15px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; flex-wrap: wrap; border-radius: 8px; margin-bottom: 15px; }
        .toolbar button { padding: 8px 15px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.3s; }
        .toolbar button:hover { background: #667eea; color: white; border-color: #667eea; }
        canvas { border: 2px solid #ddd; border-radius: 8px; background: white; cursor: crosshair; max-width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .sidebar-right { background: #f8f9fa; padding: 20px; border-left: 1px solid #ddd; overflow-y: auto; }
        .sidebar-right h3 { color: #333; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
        .property-group { margin-bottom: 20px; }
        .property-group label { display: block; margin-bottom: 8px; color: #555; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .property-group input, .property-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
        .property-group input:focus, .property-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        .export-buttons { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .export-btn { padding: 10px; border: none; border-radius: 6px; background: #667eea; color: white; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s; }
        .export-btn:hover { background: #764ba2; transform: translateY(-2px); }
        .header { grid-column: 1 / -1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; font-weight: 700; }
        @media (max-width: 1024px) { .container { grid-template-columns: 1fr 300px; } .sidebar-left { display: none; } }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .sidebar-right { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Design Pro</h1>
            <div>جاهز للتصميم</div>
        </div>
        <div class="sidebar-left">
            <h3>📐 القوالب</h3>
            <div class="templates">
                <button class="template-btn active" data-template="instagram">📷 Instagram</button>
                <button class="template-btn" data-template="tiktok">🎬 TikTok</button>
                <button class="template-btn" data-template="youtube">▶️ YouTube</button>
                <button class="template-btn" data-template="facebook">👥 Facebook</button>
                <button class="template-btn" data-template="twitter">𝕏 Twitter</button>
                <button class="template-btn" data-template="linkedin">💼 LinkedIn</button>
                <button class="template-btn" data-template="pinterest">📌 Pinterest</button>
            </div>
        </div>
        <div class="canvas-area">
            <div class="toolbar">
                <button onclick="addText()">📝 إضافة نص</button>
                <button onclick="addImage()">🖼️ إضافة صورة</button>
                <button onclick="addShape('rect')">⬜ مربع</button>
                <button onclick="addShape('circle')">⭕ دائرة</button>
                <button onclick="undo()">↶ تراجع</button>
                <button onclick="redo()">↷ إعادة</button>
                <button onclick="clearAll()">🗑️ مسح</button>
            </div>
            <canvas id="canvas"></canvas>
        </div>
        <div class="sidebar-right">
            <h3>⚙️ الخصائص</h3>
            <div class="property-group">
                <label>حجم الخط</label>
                <input type="number" id="fontSize" min="10" max="100" value="20" onchange="changeFontSize()">
            </div>
            <div class="property-group">
                <label>لون النص</label>
                <input type="color" id="fontColor" value="#000000" onchange="changeFontColor()">
            </div>
            <div class="property-group">
                <label>لون الخلفية</label>
                <input type="color" id="bgColor" value="#ffffff" onchange="changeBg()">
            </div>
            <div class="export-buttons">
                <button class="export-btn" onclick="downloadPNG()">⬇️ تحميل PNG</button>
                <button class="export-btn" onclick="downloadJPG()">⬇️ تحميل JPG</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('canvas', {
            width: 1080,
            height: 1080,
            backgroundColor: '#ffffff'
        });

        const templates = {
            instagram: { w: 1080, h: 1080 },
            tiktok: { w: 1080, h: 1920 },
            youtube: { w: 1280, h: 720 },
            facebook: { w: 1200, h: 628 },
            twitter: { w: 1024, h: 512 },
            linkedin: { w: 1200, h: 627 },
            pinterest: { w: 1000, h: 1500 }
        };

        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const t = templates[e.target.dataset.template];
                canvas.setWidth(t.w);
                canvas.setHeight(t.h);
            });
        });

        function addText() {
            const text = new fabric.Text('اكتب هنا', { left: 100, top: 100, fontSize: 20, fill: '#000000' });
            canvas.add(text);
            canvas.setActiveObject(text);
            canvas.renderAll();
        }

        function addImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    fabric.Image.fromURL(evt.target.result, (img) => {
                        img.scale(0.3);
                        canvas.add(img);
                        canvas.renderAll();
                    });
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function addShape(type) {
            let shape = type === 'rect' 
                ? new fabric.Rect({ width: 200, height: 200, fill: '#667eea' })
                : new fabric.Circle({ radius: 100, fill: '#667eea' });
            shape.set({ left: 100, top: 100 });
            canvas.add(shape);
            canvas.renderAll();
        }

        function changeFontSize() {
            const obj = canvas.getActiveObject();
            if (obj && obj.fontSize) obj.fontSize = parseInt(document.getElementById('fontSize').value);
            canvas.renderAll();
        }

        function changeFontColor() {
            const obj = canvas.getActiveObject();
            if (obj) obj.fill = document.getElementById('fontColor').value;
            canvas.renderAll();
        }

        function changeBg() {
            canvas.setBackgroundColor(document.getElementById('bgColor').value);
            canvas.renderAll();
        }

        function undo() {
            const objs = canvas.getObjects();
            if (objs.length) canvas.remove(objs[objs.length - 1]);
        }

        function redo() {
            alert('Redo غير متوفر حالياً');
        }

        function clearAll() {
            if (confirm('هل تريد مسح كل شيء؟')) {
                canvas.clear();
                canvas.setBackgroundColor('#ffffff');
            }
        }

        function downloadPNG() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'design.png';
            link.click();
        }

        function downloadJPG() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg');
            link.download = 'design.jpg';
            link.click();
        }
    </script>
</body>
</html>
